services:
  api:
    build: .
    container_name: orchestra-api
    ports:
      - "8000:8000"
      - "5000:5000"
    env_file:
      - config.env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: orchestra-mongo
    volumes:
      - orchestra-mongo-data:/data/db

volumes:
  orchestra-mongo-data:
