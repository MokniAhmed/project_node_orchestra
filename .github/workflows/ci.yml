name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_URI: mongodb://127.0.0.1:27017/orchestra_ci
      # Existing Mongo tests append their isolated database name to this base URI.
      SECURITY_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      JWT_EXPIRE_TIME: 60d
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t orchestra-api:ci .
